# Her push ve PR'da: üç modülün birim testleri + debug APK.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      # Windows'ta oluşturulan depolarda gradlew çalıştırma izni kaybolabiliyor.
      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Unit tests (domain + data + app)
        run: ./gradlew test

      - name: Assemble debug
        run: ./gradlew assembleDebug

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: "**/build/reports/tests/"
